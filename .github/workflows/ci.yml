name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system tools (OCR)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-deu poppler-utils
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt ruff
      - name: Lint
        working-directory: backend
        run: ruff check app tests && ruff format --check app tests
      - name: Tests
        working-directory: backend
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t contractly:ci .
      - name: Smoke test
        run: |
          docker run -d --name c -p 8000:8000 contractly:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/healthz && break; sleep 1; done
          curl -fsS -X POST localhost:8000/api/demo
          curl -fsS localhost:8000/api/stats/summary > /dev/null
          docker exec c tesseract --list-langs | grep deu
